# Adapted from Axolotl v0.19.0 examples/muse-glimmer/qlora.yaml.
# The runner pins the downloaded snapshot and supplies pretokenized dataset paths.
base_model: meta-models/Muse-Glimmer-30B
model_type: MuseGlimmerForConditionalGeneration
adapter: qlora
load_in_4bit: true
sample_packing: false
sequence_len: 4096
pad_to_sequence_len: false
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'
plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 1
learning_rate: 0.0001
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
warmup_ratio: 0.1
weight_decay: 0.0
bf16: true
tf32: true
gradient_checkpointing: true
attn_implementation: flash_attention_2
logging_steps: 1
save_strategy: steps
save_steps: 25
save_total_limit: 2
eval_strategy: epoch
val_set_size: 0
seed: 42
