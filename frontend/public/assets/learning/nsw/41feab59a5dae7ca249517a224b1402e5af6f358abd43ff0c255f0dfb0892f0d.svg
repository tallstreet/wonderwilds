<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"><rect width="720" height="460" fill="#fff"/><text x="35" y="50" font-family="sans-serif" font-size="28" font-weight="bold">How the roof collects rainwater</text><rect width="290" height="240" x="35" y="100" fill="#fff" stroke="#000" stroke-width="2"/><text x="70" y="145" font-family="sans-serif" font-size="23">Roof</text><text x="70" y="220" font-family="sans-serif" font-size="23">Downpipe</text><text x="70" y="300" font-family="sans-serif" font-size="23">Tank</text><line x1="135" x2="135" y1="155" y2="190" stroke="#000" stroke-width="3"/><line x1="135" x2="135" y1="235" y2="270" stroke="#000" stroke-width="3"/><text x="365" y="145" font-family="sans-serif" font-size="21">Water moves from the roof</text><text x="365" y="172" font-family="sans-serif" font-size="21">through the downpipe into</text><text x="365" y="199" font-family="sans-serif" font-size="21">the tank.</text></svg>