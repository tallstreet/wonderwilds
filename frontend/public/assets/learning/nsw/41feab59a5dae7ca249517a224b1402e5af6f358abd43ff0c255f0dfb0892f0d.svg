<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"><rect width="720" height="460" fill="white"/><text font-family="sans-serif" x="35" y="50" font-size="28" font-weight="bold">How the roof collects rainwater</text><rect x="35" y="100" width="290" height="240" fill="white" stroke="black" stroke-width="2"/><text font-family="sans-serif" x="70" y="145" font-size="23">Roof</text><text font-family="sans-serif" x="70" y="220" font-size="23">Downpipe</text><text font-family="sans-serif" x="70" y="300" font-size="23">Tank</text><line x1="135" y1="155" x2="135" y2="190" stroke="black" stroke-width="3"/><line x1="135" y1="235" x2="135" y2="270" stroke="black" stroke-width="3"/><text font-family="sans-serif" x="365" y="145" font-size="21">Water moves from the roof</text><text font-family="sans-serif" x="365" y="172" font-size="21">through the downpipe into</text><text font-family="sans-serif" x="365" y="199" font-size="21">the tank.</text></svg>