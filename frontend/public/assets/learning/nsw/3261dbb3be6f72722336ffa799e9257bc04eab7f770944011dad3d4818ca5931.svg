<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"><rect width="720" height="460" fill="white"/><text font-family="sans-serif" x="35" y="55" font-size="30" font-weight="bold">PREPARE THE DISPLAY</text><rect x="35" y="100" width="650" height="70" fill="white" stroke="black" stroke-width="2"/><text font-family="sans-serif" x="55" y="145" font-size="23">1. Sort the photographs by date.</text><rect x="35" y="195" width="650" height="70" fill="white" stroke="black" stroke-width="2"/><text font-family="sans-serif" x="55" y="240" font-size="23">2. Place them on the labelled timeline.</text><rect x="35" y="290" width="650" height="70" fill="white" stroke="black" stroke-width="2"/><text font-family="sans-serif" x="55" y="335" font-size="23">3. Check the captions against the dates.</text></svg>