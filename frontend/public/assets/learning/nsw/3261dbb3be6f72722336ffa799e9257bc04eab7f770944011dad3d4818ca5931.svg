<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"><rect width="720" height="460" fill="#fff"/><text x="35" y="55" font-family="sans-serif" font-size="30" font-weight="bold">PREPARE THE DISPLAY</text><rect width="650" height="70" x="35" y="100" fill="#fff" stroke="#000" stroke-width="2"/><text x="55" y="145" font-family="sans-serif" font-size="23">1. Sort the photographs by date.</text><rect width="650" height="70" x="35" y="195" fill="#fff" stroke="#000" stroke-width="2"/><text x="55" y="240" font-family="sans-serif" font-size="23">2. Place them on the labelled timeline.</text><rect width="650" height="70" x="35" y="290" fill="#fff" stroke="#000" stroke-width="2"/><text x="55" y="335" font-family="sans-serif" font-size="23">3. Check the captions against the dates.</text></svg>