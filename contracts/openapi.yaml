        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/GameCommand"
              }
            }
          }
        },
        "description": " Authored training uses start_encounter with a server-offered training ID as beatId. The server binds the owned recipient, milestone and rules version. Attempts and abandonment use the issued encounter ID. Supported completion awards the same configured character XP, once per milestone; replay is practice without duplicate XP."
      }
