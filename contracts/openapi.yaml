{
  "openapi": "3.1.0",
  "info": {
    "title": "Wonderwilds gameplay API",
    "version": "1.0.0",
    "description": "Authored development gameplay surface. Commands support explicit encounter abandonment with revision and idempotency checks. Parent lifecycle endpoints remain integration work. Personal quest commands drive authored choice/activity/handoff documents; generation contracts are future-facing and expose no provider endpoint."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "parentSession": []
    }
  ],
  "paths": {
